plugins {
  id "maven-publish"
  id "com.github.node-gradle.node" version "7.1.0"
  id "com.enonic.xp.app"
  id "no.item.xp.codegen" version "3.0.0-SNAPSHOT"
}

dependencies {
  include xplibs.portal
}

repositories {
  mavenCentral()
  xp.enonicRepo()
}

node {
  download = true
  // Single source of truth for the Node version, shared with .github/workflows and nvm
  version = file(".nvmrc").text.trim()
}

processResources {
  exclude "**/.gitkeep"
  exclude "**/*.json"
  exclude "**/*.ts"
  exclude "**/*.tsx"
}

tasks.register("npmBuild", NpmTask) {
  args = [
    "run",
    "--silent",
    "build"
  ]
  dependsOn npmInstall
  environment = [
    "FORCE_COLOR": "true",
    "LOG_LEVEL_FROM_GRADLE": gradle.startParameter.logLevel.toString(),
    "NODE_ENV": project.findProperty("env") == "dev" ? "development" : "production"
  ]
  inputs.dir "src/main/resources"
  outputs.dir "build/resources/main"
  outputs.upToDateWhen { false }
}

jar.dependsOn npmBuild

tasks.register("npmCheck", NpmTask) {
  // check:types reads the types generated from the YAML descriptors
  dependsOn npmInstall, generateTypeScript
  args = [
    "run",
    "check"
  ]
  environment = [
    "FORCE_COLOR": "true",
  ]
}

check.dependsOn npmCheck

tasks.withType(Copy).configureEach {
  includeEmptyDirs = false
}

publishing {
  repositories {
    maven {
      name = "itemtestRepository"
      url = version.endsWith('SNAPSHOT')
        ? "https://repo.itemtest.no/snapshots"
        : "https://repo.itemtest.no/releases"
      credentials(PasswordCredentials)
      authentication {
        basic(BasicAuthentication)
      }
    }
  }
  publications {
    maven(MavenPublication) {
      from components.java
      groupId group
      artifactId projectName
      version version
    }
  }
}
